services:
  xlabplayer:
    build:
      context: .
      args:
        YTDLP_VERSION: ${YTDLP_VERSION:-2026.08.19}
        INSTALL_POT_PLUGIN: ${INSTALL_POT_PLUGIN:-false}
    # To pull a prebuilt image from GitHub Container Registry or Docker Hub instead of building locally,
    # comment out `build:` above and uncomment the line below:
    # image: ghcr.io/cjng20u/xlab-player:latest
    container_name: xlabplayer
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      # Persistent SQLite database (xlabplayer.db + stream_url_cache), covers, cookies.txt, and yt-dlp JS player cache (/app/data/ytdlp-cache)
      - ./data:/app/data
      # Persistent disk audio cache (AUDIO_CACHE_MB, default 2048 MB, LRU-evicted; separate mount so cache can live on fast local SSD)
      - ./audio_cache:/app/data/audio-cache
      # Local music library directory
      - ./music_library:/music
      # To bind-mount an NFS/SMB NAS share already mounted on your Docker host,
      # replace `./music_library:/music` above with your host mount point, e.g.:
      # - /mnt/nas/music:/music
      # Or mount read-only (streaming & scanning only; disables downloads/uploads/deletes):
      # - /mnt/nas/music:/music:ro

  # Optional PO token provider sidecar (opt-in via `--profile pot`).
  # Enable by setting in `.env`:
  #   INSTALL_POT_PLUGIN=true
  #   POT_PROVIDER_URL=http://bgutil-provider:4416
  # Then start with: docker compose --profile pot up -d --build
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: xlabplayer-bgutil-provider
    profiles:
      - pot
    init: true
    restart: unless-stopped
    expose:
      - "4416"
