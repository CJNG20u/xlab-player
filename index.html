<!doctype html>
<html lang="en" class="dark" data-theme="spotify-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>xlabplayer — Self-Hosted Music Player</title>
    <meta name="description" content="Self-hosted music streaming and downloading Progressive Web App for Proxmox LXC and NAS libraries." />
    <meta property="og:title" content="xlabplayer — Self-Hosted Music Player" />
    <meta property="og:description" content="Self-hosted music streaming and downloading Progressive Web App for Proxmox LXC and NAS libraries." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="xlabplayer" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icon-96.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('xlabplayer-theme');
          if (
            t !== 'spotify-dark' &&
            t !== 'apple-dark' &&
            t !== 'apple-light' &&
            t !== 'tidal-dark'
          ) {
            t = 'spotify-dark';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', t);
          root.classList.toggle('dark', t !== 'apple-light');
          var tabBarColor = t === 'apple-light' ? '#ffffff' : '#000000';
          var topEdgeBgColor = t === 'apple-light' ? '#f3f3f7' : '#000000';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', tabBarColor);
          var appleMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (appleMeta) appleMeta.setAttribute('content', t === 'apple-light' ? 'default' : 'black-translucent');
          root.style.backgroundColor = topEdgeBgColor;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
